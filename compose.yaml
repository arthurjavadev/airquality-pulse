services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airquality
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: airquality
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airquality -d airquality"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: airquality
      RABBITMQ_DEFAULT_PASS: local_dev_only
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  migrate:
    build: .
    command: python -m src.migrate
    environment: &env
      DATABASE_URL: postgresql+psycopg://airquality:local_dev_only@db:5432/airquality
      RABBITMQ_URL: amqp://airquality:local_dev_only@rabbitmq:5672/%2F
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 src.app:app
    environment: *env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  analyzer:
    build: .
    command: python -m src.consumer
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build: .
    command: python -m src.collector_worker --interval-seconds 3600
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
